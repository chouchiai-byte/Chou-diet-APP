<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="控食">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>飲食控制</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--text:#1c1c1a;--muted:#6b6b66;--line:#e3e3de;--accent:#0f766e;--accent-bg:#e0f2ef;--on-accent:#fff;--ok:#15803d;--warn:#a85a07;--bad:#b91c1c;--bad-bg:#fdecec;--warn-bg:#fdf3e2}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1e1d;--text:#ececea;--muted:#a3a39e;--line:#33332f;--accent:#2dd4bf;--accent-bg:#123430;--on-accent:#062a26;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--bad-bg:#3a1a1a;--warn-bg:#3a2e12}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:baseline;justify-content:space-between}
header h1{font-size:26px;margin:0;font-weight:700}
#dateLabel{color:var(--muted);font-size:14px}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 10px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 10px}
.bar>i{display:block;height:100%;border-radius:4px}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;background:var(--accent);color:var(--on-accent);font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:var(--accent-bg);color:var(--accent)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
textarea{min-height:70px}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.alert{border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.info{background:var(--accent-bg);color:var(--accent)}
.big{font-size:34px;font-weight:700;line-height:1.1}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0;padding-top:0}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:14px;color:var(--text);font-family:inherit;min-width:56px}
.seg button.on{background:var(--card);font-weight:600}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin:0 0 8px;color:var(--text);font-family:inherit;font-size:15px}
.opt.on{border-color:var(--accent);background:var(--accent-bg)}
.opt b{display:block}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
#toast.show{opacity:1}
svg.chart text{fill:var(--muted);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
th{color:var(--muted);font-weight:500;border-top:0}
td:first-child,th:first-child{text-align:left}
.red{color:var(--bad);font-weight:600}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
details summary{color:var(--accent);font-size:13px;cursor:pointer;margin-top:6px}
.hidefile{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<header><h1 id="title">今日</h1><span id="dateLabel"></span></header>
<main id="view"></main>
<nav id="tabs">
  <button data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>今日</button>
  <button data-t="snap" onclick="go('snap')"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l2-3h4l2 3"/><circle cx="12" cy="13.5" r="3.5"/></svg>拍照記錄</button>
  <button data-t="log" onclick="go('log')"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>飲食紀錄</button>
  <button data-t="body" onclick="go('body')"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>身體數據</button>
  <button data-t="settings" onclick="go('settings')"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>標準與提醒</button>
</nav>
<div id="sheet" class="sheet hidden" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<script>
const KEY='dietapp_v1';
const BEER={kcal:140,carbs:11};
const WATER_GOAL=2500;
const NUTS=[['kcal','熱量','大卡'],['protein','蛋白質','g'],['carbs','碳水化合物','g'],['fat','脂肪','g'],['satfat','飽和脂肪','g'],['sugar','添加糖','g'],['fiber','膳食纖維','g'],['sodium','鈉','mg']];
const NK=NUTS.map(n=>n[0]);
const MEALS=['早餐','午餐','點心','晚餐','宵夜'];
const EXERCISE={'快走':4.3,'慢跑':7.0,'游泳':6.0,'騎自行車':6.8,'重量訓練':5.0,'爬山':6.5,'球類運動':6.0,'其他':4.0};
const DEFAULTS={
  apiKey:'',model:'claude-sonnet-5-5',
  targets:{kcal:1750,protein:[90,100],carbs:[150,180],carbsMin:130,fat:[55,70],satfat:19,sugar:25,fiber:25,sodium:2300},
  height:175,startWeight:99,goals:[94,89],waistGoal:90,
  alcohol:{plan:null,start:null},
  reminders:{breakfast:'09:30',lunch:'13:30',dinner:'20:00',weigh:'09:00'}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const r0=n=>Math.round(num(n));
const r1=n=>Math.round(num(n)*10)/10;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const weekStart=s=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const WD='日一二三四五六';
const md=s=>{const d=new Date(s+'T00:00');return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`};

function migrate(d){
  const s=d.settings||{};
  d.settings={...structuredClone(DEFAULTS),...s,
    targets:{...DEFAULTS.targets,...(s.targets||{})},
    alcohol:{...DEFAULTS.alcohol,...(s.alcohol||{})},
    reminders:{...DEFAULTS.reminders,...(s.reminders||{})}};
  d.meals=d.meals||[];d.body=d.body||[];d.drinks=d.drinks||[];d.water=d.water||{};
  return d;
}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return migrate(d)}catch(e){}return migrate({})}
let db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('儲存空間不足，請到設定匯出備份')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000)}

/* ---------- 計算 ---------- */
const beerOn=date=>db.drinks.filter(d=>d.date===date).reduce((a,d)=>a+d.cans,0);
function weekBeer(date){const ws=weekStart(date);let cans=0,sessions=0;for(let i=0;i<7;i++){const c=beerOn(addDays(ws,i));cans+=c;if(c>0)sessions++}return{cans,sessions}}
function dayTotals(date){
  const t=Object.fromEntries(NK.map(k=>[k,0]));t.refined=0;
  db.meals.filter(m=>m.date===date).forEach(m=>m.items.forEach(it=>{NK.forEach(k=>t[k]+=num(it[k]));if(it.refined)t.refined++}));
  const c=beerOn(date);t.kcal+=c*BEER.kcal;t.carbs+=c*BEER.carbs;t.cans=c;return t;
}
function tdef(k){const T=db.settings.targets;return{kcal:{type:'max',max:T.kcal},protein:{type:'range',min:T.protein[0],max:T.protein[1]},carbs:{type:'range',min:T.carbs[0],max:T.carbs[1]},fat:{type:'range',min:T.fat[0],max:T.fat[1]},satfat:{type:'max',max:T.satfat},sugar:{type:'max',max:T.sugar},fiber:{type:'min',min:T.fiber},sodium:{type:'max',max:T.sodium}}[k]}
function status(k,v){const d=tdef(k);if(d.type==='max')return v>d.max?'bad':'ok';if(d.type==='min')return v>=d.min?'ok':'low';return v>d.max?'bad':v>=d.min?'ok':'low'}
function targetText(k){const d=tdef(k),u=NUTS.find(n=>n[0]===k)[2];if(d.type==='max')return(k==='kcal'?'':'< ')+d.max+' '+u;if(d.type==='min')return'≥ '+d.min+' '+u;return d.min+'–'+d.max+' '+u}
function barHtml(k,v){const d=tdef(k),scale=(d.max||d.min)*1.3,pct=Math.min(100,v/scale*100),st=status(k,v);const col=st==='bad'?'var(--bad)':st==='ok'?'var(--ok)':'var(--accent)';return`<div class="bar"><i style="width:${pct}%;background:${col}"></i></div>`}
function alcoholRule(date){
  const a=db.settings.alcohol;if(!a.plan)return null;
  if(a.plan==='A')return{week:0,session:0,label:'暫停喝酒 3 個月',done:daysBetween(a.start,date)>=90};
  if(a.plan==='B')return{week:1,session:1,label:'一週最多 1 罐'};
  if(a.plan==='C')return{week:Infinity,session:Infinity,label:'只記錄，不設上限'};
  const d=daysBetween(a.start,date);
  if(d<30)return{week:6,session:3,times:2,label:'逐步減量第 1 個月：一週 2 次、每次最多 3 罐'};
  if(d<60)return{week:2,session:2,times:1,label:'逐步減量第 2 個月：一週 1 次、每次最多 2 罐'};
  return{week:1,session:1,label:'逐步減量第 3 個月起：一週最多 1 罐'};
}
function latestWeight(){const w=db.body.filter(e=>e.type==='weight').sort((a,b)=>(a.date+a.ts)<(b.date+b.ts)?1:-1)[0];return w?w.v.weight:db.settings.startWeight}
function guessMeal(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?'早餐':h<14.5?'午餐':h<17?'點心':h<21?'晚餐':'宵夜'}

/* ---------- 導覽 ---------- */
let tab='home',draft=null,logDate=today(),metric='weight',busy=false;
const TITLES={home:'今日',snap:'記錄飲食',log:'飲食紀錄',body:'身體數據',settings:'標準與提醒'};
function go(t){tab=t;renderView();window.scrollTo(0,0)}
function renderView(){
  $('#title').textContent=TITLES[tab];
  $('#dateLabel').textContent=tab==='home'?md(today()):'';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#view').innerHTML={home:renderHome,snap:renderSnap,log:renderLog,body:renderBody,settings:renderSettings}[tab]();
}
function openSheet(html){$('#panel').innerHTML=html;$('#sheet').classList.remove('hidden')}
function closeSheet(){$('#sheet').classList.add('hidden')}

/* ---------- 今日 ---------- */
function alertsHtml(date,t){
  const s=db.settings,out=[],now=nowHM();
  if(!s.apiKey)out.push(['info','到「標準與提醒」輸入 Claude API 金鑰後，就能拍照辨識食物。']);
  const rule=alcoholRule(date),wb=weekBeer(date);
  if(t.cans>=3)out.push(['bad',`今天已喝 ${t.cans} 罐。您有服用 metformin，一次大量飲酒會增加乳酸中毒風險，也請避免空腹喝酒。`]);
  if(rule){
    if(rule.done)out.push(['info','暫停喝酒 3 個月已期滿，可以安排抽血，並到設定選擇下一階段的飲酒目標。']);
    else if(wb.cans>rule.week)out.push(['warn',`本週已喝 ${wb.cans} 罐，超過目標 ${rule.week} 罐。`]);
    else if(rule.times&&wb.sessions>rule.times)out.push(['warn',`本週已喝 ${wb.sessions} 次，超過目標 ${rule.times} 次。`]);
  }
  const has=m=>db.meals.some(x=>x.date===date&&x.mealType===m);
  [['breakfast','早餐'],['lunch','午餐'],['dinner','晚餐']].forEach(([k,n])=>{if(now>=s.reminders[k]&&!has(n))out.push(['warn',`還沒記錄${n}。`])});
  if(now>=s.reminders.weigh&&!db.body.some(e=>e.type==='weight'&&e.date===date))out.push(['info','今天還沒量體重。']);
  if(now>='20:00'&&db.meals.some(m=>m.date===date)&&t.carbs<s.targets.carbsMin)out.push(['warn',`今天碳水只有 ${r0(t.carbs)} g，低於下限 ${s.targets.carbsMin} g。有服降血糖藥，請不要吃得太少。`]);
  if(t.sugar>s.targets.sugar)out.push(['bad',`添加糖已達 ${r0(t.sugar)} g，超過上限 ${s.targets.sugar} g。`]);
  return out.map(([c,m])=>`<div class="alert ${c}">${esc(m)}</div>`).join('');
}
function renderHome(){
  const d=today(),t=dayTotals(d),T=db.settings.targets,remain=T.kcal-r0(t.kcal);
  let h=alertsHtml(d,t);
  if(!db.settings.alcohol.plan)h+=alcoholPlanCard(true);
  h+=`<div class="card"><div class="row" style="align-items:flex-end"><div><div class="muted">今日熱量</div><div class="big">${r0(t.kcal)}<span class="muted" style="font-size:15px;font-weight:400"> / ${T.kcal} 大卡</span></div></div><div style="text-align:right"><div class="muted">${remain>=0?'還可以吃':'已超過'}</div><div style="font-size:22px;font-weight:700;color:${remain>=0?'var(--ok)':'var(--bad)'}">${Math.abs(remain)}</div></div></div>${barHtml('kcal',t.kcal)}</div>`;
  h+=`<div class="card"><h2>營養素</h2>`+NUTS.slice(1).map(([k,n,u])=>`<div class="row"><span>${n}</span><span class="muted"><b style="color:var(--text)">${r0(t[k])}</b> ${u}　目標 ${targetText(k)}</span></div>${barHtml(k,t[k])}`).join('')+(t.refined?`<div class="muted">今天吃了 ${t.refined} 項精緻澱粉或甜食</div>`:'')+`</div>`;
  const rule=alcoholRule(d),wb=weekBeer(d);
  h+=`<div class="card"><div class="row"><h2 style="margin:0">啤酒</h2><span class="muted">${rule?esc(rule.label):'尚未選擇目標'}</span></div>
  <div class="row" style="margin-top:8px"><div><div class="big" style="font-size:28px">${t.cans}<span class="muted" style="font-size:14px;font-weight:400"> 罐（今天）</span></div><div class="muted">本週 ${wb.cans} 罐${rule&&isFinite(rule.week)?` / 上限 ${rule.week} 罐`:''}${rule&&rule.times?`，${wb.sessions} / ${rule.times} 次`:''}</div></div>
  <div style="display:flex;gap:8px"><button class="btn sec" onclick="addBeer(-1)" aria-label="減一罐">−</button><button class="btn" onclick="addBeer(1)">+1 罐</button></div></div>
  <div class="muted" style="margin-top:6px">每罐以 330 ml、${BEER.kcal} 大卡、碳水 ${BEER.carbs} g 計入當日總量</div></div>`;
  const w=db.water[d]||0;
  h+=`<div class="card"><div class="row"><div><h2 style="margin:0">喝水</h2><div class="muted">${w} / ${WATER_GOAL} ml</div></div><div style="display:flex;gap:8px"><button class="btn sec" onclick="addWater(-250)" aria-label="減 250 ml">−</button><button class="btn" onclick="addWater(250)">+250 ml</button></div></div><div class="bar"><i style="width:${Math.min(100,w/WATER_GOAL*100)}%;background:var(--accent)"></i></div></div>`;
  const meals=db.meals.filter(m=>m.date===d).sort((a,b)=>a.ts-b.ts);
  h+=`<div class="card"><div class="row"><h2 style="margin:0">今天吃了</h2><button class="btn sm" onclick="go('snap')">新增</button></div><div style="margin-top:10px">${meals.length?meals.map(mealRow).join(''):'<div class="muted">還沒有紀錄</div>'}</div></div>`;
  return h;
}
function mealRow(m){
  const k=m.items.reduce((a,i)=>a+num(i.kcal),0),c=m.items.reduce((a,i)=>a+num(i.carbs),0);
  return`<div class="item"><div class="row" style="align-items:flex-start">${m.photo?`<img class="thumb" src="${m.photo}" alt="">`:''}<div style="flex:1;min-width:0"><b>${esc(m.mealType)}</b> <span class="muted">${r0(k)} 大卡 · 碳水 ${r0(c)} g</span><div class="muted">${esc(m.items.map(i=>i.name).join('、'))}</div></div><button class="btn sm danger" onclick="delMeal('${m.id}')">刪除</button></div></div>`;
}
function addBeer(n){
  const d=today();
  if(n>0){db.drinks.push({id:uid(),date:d,cans:1,ts:Date.now()});
    const rule=alcoholRule(d),c=beerOn(d);
    if(rule&&c>rule.session)toast(rule.session===0?'目前是暫停喝酒期間':`已超過單次上限 ${rule.session} 罐`);
  }else{const idx=db.drinks.map(x=>x.date).lastIndexOf(d);if(idx<0)return;db.drinks.splice(idx,1)}
  save();renderView();
}
function addWater(n){const d=today();db.water[d]=Math.max(0,(db.water[d]||0)+n);save();renderView()}
function delMeal(id){if(!confirm('刪除這一餐？'))return;db.meals=db.meals.filter(m=>m.id!==id);save();renderView()}

/* ---------- 飲酒方案 ---------- */
function alcoholPlanCard(setup){
  const cur=db.settings.alcohol.plan;

const FORMAT=`只回傳 JSON，不要任何其他文字，格式：
{"items":[{"name":"食物名稱","portion":"估計份量，例如 1 碗（約 200 g）","kcal":0,"protein":0,"carbs":0,"fat":0,"satfat":0,"sugar":0,"fiber":0,"sodium":0,"refined":false}],"note":"一句話說明估算的不確定處或飲食建議"}
單位：kcal 為大卡，sodium 為毫克，其餘為公克。sugar 指添加糖（不含水果與奶類的天然糖）。refined 表示是否為精緻澱粉或甜食（白飯、白麵、麵包、糕點、含糖飲料等）。數字請用數值，不要加單位。`;
const ROLE='你是台灣的臨床營養師。使用者是 48 歲男性，正在控制血糖與三酸甘油酯，請依台灣常見的份量與做法估算營養，特別仔細估算碳水化合物與添加糖。';
async function callRaw(content,maxTokens){
  const s=db.settings;if(!s.apiKey)throw new Error('尚未設定 API 金鑰');
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':s.apiKey,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:s.model,max_tokens:maxTokens||2000,messages:[{role:'user',content}]})});
  if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();m=j.error?.message||m}catch(e){}throw new Error(m)}
  const j=await r.json();return j.content.filter(c=>c.type==='text').map(c=>c.text).join('');
}
async function callJSON(content){const txt=await callRaw(content);const m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error('AI 回覆格式無法解析');return JSON.parse(m[0])}
function norm(it){return{name:String(it.name||'食物'),portion:String(it.portion||''),refined:!!it.refined,mult:1,base:Object.fromEntries(NK.map(k=>[k,num(it[k])]))}}
const blank=()=>norm({name:''});
function readImage(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const out=sz=>{const sc=Math.min(1,sz/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c};const full=out(1280).toDataURL('image/jpeg',.85),thumb=out(240).toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);res({full,thumb})};img.onerror=()=>rej(new Error('無法讀取照片'));img.src=url})}
function loadingView(msg){$('#view').innerHTML=`<div class="card" style="text-align:center"><div class="spin"></div><div>${esc(msg)}</div><div class="muted">約需 5–15 秒</div></div>`}
async function onPhoto(input){
  const file=input.files[0];input.value='';if(!file||busy)return;
  if(!db.settings.apiKey){toast('請先到「標準與提醒」輸入 API 金鑰');return}
  busy=true;loadingView('AI 辨識中…');let img;
  try{img=await readImage(file);const res=await callJSON([{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img.full.split(',')[1]}},{type:'text',text:ROLE+'\n請辨識照片中的每一樣食物與飲料。若照片中沒有食物，items 回傳空陣列並在 note 說明。\n'+FORMAT}]);
    draft={photo:img.thumb,items:(res.items||[]).map(norm),note:res.note||'',mealType:guessMeal(),date:today()};
    if(!draft.items.length)draft.items.push(blank());
  }catch(e){draft={photo:img?img.thumb:null,items:[blank()],note:'辨識失敗：'+e.message+'。可以手動輸入。',err:true,mealType:guessMeal(),date:today()}}
  busy=false;renderView();
}
async function estimateText(){
  const txt=$('#descText').value.trim();if(!txt){toast('請先輸入吃了什麼');return}
  if(!db.settings.apiKey){toast('請先到「標準與提醒」輸入 API 金鑰');return}
  busy=true;loadingView('AI 估算中…');
  try{const res=await callJSON([{type:'text',text:ROLE+`\n使用者描述他吃了：「${txt}」。請拆成各項食物估算。\n`+FORMAT}]);draft={photo:null,items:(res.items||[]).map(norm),note:res.note||'',mealType:guessMeal(),date:today()};if(!draft.items.length)draft.items.push(blank())}
  catch(e){draft={photo:null,items:[blank()],note:'估算失敗：'+e.message,err:true,mealType:guessMeal(),date:today()}}
  busy=false;renderView();
}
function manual(){draft={photo:null,items:[blank()],note:'',mealType:guessMeal(),date:today()};renderView()}
function recentFoods(){const seen=new Set,out=[];[...db.meals].sort((a,b)=>b.ts-a.ts).forEach(m=>m.items.forEach(i=>{if(i.name&&!seen.has(i.name)&&out.length<12){seen.add(i.name);out.push(i)}}));return out}
function quickAdd(name){const it=recentFoods().find(i=>i.name===name);if(!it)return;const n=norm({name:it.name,portion:it.portion,refined:it.refined,...(it.base||it)});if(!draft)draft={photo:null,items:[],note:'',mealType:guessMeal(),date:today()};draft.items.push(n);renderView()}

  h+=`<div class="card"><h2>用文字描述</h2><textarea id="descText" placeholder="例如：滷肉飯小碗、燙青菜、貢丸湯"></textarea><button class="btn block" style="margin-top:8px" onclick="estimateText()">AI 估算</button></div>`;

const iv=(it,k)=>num(it.base[k])*it.mult;

  </div>`).join('')}<button class="btn sec block" style="margin-top:8px" onclick="dAdd()">＋ 新增一項</button></div>`;
  h+=`<div class="card"><h2>這一餐合計</h2><div class="grid2">${NUTS.map(([k,n,u])=>`<div class="row"><span class="muted">${n}</span><b>${r0(tot[k])} ${u}</b></div>`).join('')}</div>
   <label class="f">餐別</label><div class="seg">${MEALS.map(m=>`<button class="${d.mealType===m?'on':''}" onclick="draft.mealType='${m}';renderView()">${m}</button>`).join('')}</div>

function dSet(i,k,v){const it=draft.items[i];if(k==='mult')it.mult=num(v);else it[k]=v;renderView()}
function dBase(i,k,v){draft.items[i].base[k]=num(v);draft.items[i].open=true;renderView()}
function dDel(i){draft.items.splice(i,1);renderView()}
function dAdd(){draft.items.push({...blank(),open:true});renderView()}
function saveDraft(){
  const items=draft.items.filter(it=>it.name.trim());if(!items.length){toast('至少要有一項食物');return}
  db.meals.push({id:uid(),date:draft.date||today(),ts:Date.now(),mealType:draft.mealType,photo:draft.photo,items:items.map(it=>({name:it.name.trim(),portion:it.portion,refined:it.refined,mult:it.mult,base:it.base,...Object.fromEntries(NK.map(k=>[k,r1(iv(it,k))]))}))});

  const d=logDate,t=dayTotals(d),T=db.settings.targets;

  const rows=[];let sum={kcal:0,carbs:0,sugar:0,cans:0},n=0;
  for(let i=6;i>=0;i--){const day=addDays(today(),-i),x=dayTotals(day),logged=db.meals.some(m=>m.date===day);rows.push({day,x,logged});if(logged){n++;sum.kcal+=x.kcal;sum.carbs+=x.carbs;sum.sugar+=x.sugar}sum.cans+=x.cans}
  h+=`<div class="card"><h2>最近 7 天</h2><table><tr><th>日期</th><th>熱量</th><th>碳水</th><th>添加糖</th><th>啤酒</th></tr>${rows.map(({day,x,logged})=>`<tr onclick="logDate='${day}';renderView()"><td>${md(day)}</td><td class="${x.kcal>T.kcal?'red':''}">${logged||x.cans?r0(x.kcal):'—'}</td><td class="${x.carbs>T.carbs[1]?'red':''}">${logged?r0(x.carbs):'—'}</td><td class="${x.sugar>T.sugar?'red':''}">${logged?r0(x.sugar):'—'}</td><td>${x.cans||''}</td></tr>`).join('')}
  <tr><td><b>平均</b></td><td>${n?r0(sum.kcal/n):'—'}</td><td>${n?r0(sum.carbs/n):'—'}</td><td>${n?r0(sum.sugar/n):'—'}</td><td>${sum.cans}</td></tr></table><div class="muted" style="margin-top:6px">平均只計算有記錄的天數。紅字表示超過標準。</div></div>`;
  return h;
}

/* ---------- 身體數據 ---------- */
const BTYPES={weight:'體重／體脂',waist:'腰圍',bp:'血壓',glucose:'血糖',sleep:'睡眠',exercise:'運動'};
const METRICS={weight:'體重',fat:'體脂',waist:'腰圍',bp:'血壓',glucose:'血糖',sleep:'睡眠',exercise:'運動'};
function bodyDesc(e){const v=e.v;switch(e.type){case'weight':return`體重 ${v.weight} kg${v.fat?`，體脂 ${v.fat}%`:''}`;case'waist':return`腰圍 ${v.waist} cm`;case'bp':return`血壓 ${v.sys}/${v.dia}${v.pulse?`，脈搏 ${v.pulse}`:''}`;case'glucose':return`血糖 ${v.value} mg/dl（${v.when}）`;case'sleep':return`睡眠 ${v.hours} 小時（${v.bed}–${v.wake}），品質 ${v.quality}/5`;case'exercise':return`${v.kind} ${v.minutes} 分鐘，約 ${v.kcal} 大卡`}}
function series(m){
  const E=t=>db.body.filter(e=>e.type===t).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
  const S=db.settings;
  switch(m){
    case'weight':return{s:[{n:'體重',p:E('weight').map(e=>({x:e.date,y:e.v.weight}))}],t:S.goals,u:'kg'};
    case'fat':return{s:[{n:'體脂',p:E('weight').filter(e=>e.v.fat).map(e=>({x:e.date,y:e.v.fat}))}],t:[25],u:'%'};
    case'waist':return{s:[{n:'腰圍',p:E('waist').map(e=>({x:e.date,y:e.v.waist}))}],t:[S.waistGoal],u:'cm'};
    case'bp':return{s:[{n:'收縮壓',p:E('bp').map(e=>({x:e.date,y:e.v.sys}))},{n:'舒張壓',p:E('bp').map(e=>({x:e.date,y:e.v.dia}))}],t:[130,80],u:'mmHg'};
    case'glucose':return{s:[{n:'空腹血糖',p:E('glucose').filter(e=>e.v.when==='空腹').map(e=>({x:e.date,y:e.v.value}))}],t:[100],u:'mg/dl'};
    case'sleep':return{s:[{n:'睡眠',p:E('sleep').map(e=>({x:e.date,y:e.v.hours}))}],t:[7],u:'小時'};
    case'exercise':{const by={};E('exercise').forEach(e=>by[e.date]=(by[e.date]||0)+e.v.minutes);return{s:[{n:'運動',p:Object.keys(by).sort().map(x=>({x,y:by[x]}))}],t:[30],u:'分鐘'}}
  }
}
function lineChart({s,t,u}){
  const pts=s.flatMap(x=>x.p);if(!pts.length)return'<div class="muted" style="padding:30px 0;text-align:center">尚無資料</div>';
  const dates=[...new Set(pts.map(p=>p.x))].sort().slice(-60),xi=Object.fromEntries(dates.map((d,i)=>[d,i]));
  const ys=pts.filter(p=>p.x in xi).map(p=>p.y).concat(t);let lo=Math.min(...ys),hi=Math.max(...ys);const pd=(hi-lo)*.12||2;lo-=pd;hi+=pd;
  const W=340,H=170,L=36,R=8,TP=10,B=22,X=i=>dates.length===1?(L+W-R)/2:L+(W-L-R)*i/(dates.length-1),Y=v=>TP+(H-TP-B)*(hi-v)/(hi-lo);
  const cols=['var(--accent)','var(--warn)'];let g='';
  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-width="0.5"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end">${r1(v)}</text>`}
  t.forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--ok)" stroke-width="1" stroke-dasharray="4 3"/>`);
  s.forEach((x,si)=>{const p=x.p.filter(q=>q.x in xi);g+=`<polyline fill="none" style="stroke:${cols[si]}" stroke-width="2" points="${p.map(q=>X(xi[q.x])+','+Y(q.y)).join(' ')}"/>`+p.map(q=>`<circle cx="${X(xi[q.x])}" cy="${Y(q.y)}" r="2.5" style="fill:${cols[si]}"/>`).join('')});
  g+=`<text x="${L}" y="${H-6}">${dates[0].slice(5)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${dates[dates.length-1].slice(5)}</text>`;
  const legend=s.map((x,i)=>`<span style="color:${cols[i]}">● ${x.n}</span>`).join('　')+`　<span style="color:var(--ok)">--- 目標 ${t.join(' / ')} ${u}</span>`;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="muted">${legend}</div>`;
}

function fld(id,label,type,val,attrs){return`<div><label class="f" for="${id}">${label}</label><input id="${id}" type="${type}" value="${val??''}" ${type==='number'?'inputmode="decimal"':''} ${attrs||''}></div>`}
function bodyForm(type){
  let f='';
  if(type==='weight')f=`<div class="grid2">${fld('f_weight','體重（kg）','number',r1(latestWeight()))}${fld('f_fat','體脂（%，可不填）','number','')}</div>`;
  if(type==='waist')f=fld('f_waist','腰圍（cm，肚臍高度）','number','');
  if(type==='bp')f=`<div class="grid3">${fld('f_sys','收縮壓','number','')}${fld('f_dia','舒張壓','number','')}${fld('f_pulse','脈搏','number','')}</div>`;
  if(type==='glucose')f=`<div class="grid2">${fld('f_value','血糖（mg/dl）','number','')}<div><label class="f">測量時機</label><select id="f_when">${['空腹','飯前','飯後 2 小時','睡前'].map(x=>`<option>${x}</option>`).join('')}</select></div></div>`;
  if(type==='sleep')f=`<div class="grid2">${fld('f_bed','就寢時間','time','23:30')}${fld('f_wake','起床時間','time','07:00')}</div><label class="f">睡眠品質（1 很差 – 5 很好）</label><select id="f_q">${[1,2,3,4,5].map(x=>`<option ${x===3?'selected':''}>${x}</option>`).join('')}</select>`;
  if(type==='exercise')f=`<div class="grid2"><div><label class="f">運動類型</label><select id="f_kind" oninput="exPrev()">${Object.keys(EXERCISE).map(x=>`<option>${x}</option>`).join('')}</select></div>${fld('f_min','時間（分鐘）','number','30','oninput="exPrev()"')}</div><div class="muted" id="exp" style="margin-top:6px"></div><div class="muted">運動消耗只做紀錄，不會加回每日熱量額度。</div>`;
  openSheet(`<h2 style="margin:0 0 8px;font-size:18px">新增${BTYPES[type]}</h2>${f}${fld('f_date','日期','date',today())}<div class="grid2" style="margin-top:14px"><button class="btn sec" onclick="closeSheet()">取消</button><button class="btn" onclick="saveBody('${type}')">儲存</button></div>`);
  if(type==='exercise')exPrev();
}
function exPrev(){const k=$('#f_kind').value,m=num($('#f_min').value);$('#exp').textContent=`約消耗 ${r0(EXERCISE[k]*latestWeight()*m/60)} 大卡（依體重 ${r1(latestWeight())} kg 估算）`}
function saveBody(type){
  const g=id=>$('#'+id)?.value,n=id=>num(g(id));let v;
  if(type==='weight'){if(!n('f_weight'))return toast('請輸入體重');v={weight:n('f_weight')};if(n('f_fat'))v.fat=n('f_fat')}
  if(type==='waist'){if(!n('f_waist'))return toast('請輸入腰圍');v={waist:n('f_waist')}}
  if(type==='bp'){if(!n('f_sys')||!n('f_dia'))return toast('請輸入血壓');v={sys:n('f_sys'),dia:n('f_dia')};if(n('f_pulse'))v.pulse=n('f_pulse')}
  if(type==='glucose'){if(!n('f_value'))return toast('請輸入血糖');v={value:n('f_value'),when:g('f_when')}}
  if(type==='sleep'){const[bh,bm]=g('f_bed').split(':').map(Number),[wh,wm]=g('f_wake').split(':').map(Number);const mins=((wh*60+wm)-(bh*60+bm)+1440)%1440;v={bed:g('f_bed'),wake:g('f_wake'),hours:r1(mins/60),quality:n('f_q')}}
  if(type==='exercise'){if(!n('f_min'))return toast('請輸入時間');const k=g('f_kind');v={kind:k,minutes:n('f_min'),kcal:r0(EXERCISE[k]*latestWeight()*n('f_min')/60)}}
  db.body.push({id:uid(),type,date:g('f_date')||today(),ts:Date.now(),v});save();closeSheet();toast('已儲存');renderView();
}
function delBody(id){if(!confirm('刪除這筆紀錄？'))return;db.body=db.body.filter(e=>e.id!==id);save();renderView()}

/* ---------- 設定 ---------- */
function renderSettings(){
  const S=db.settings,T=S.targets,R=S.reminders;
  let h=`<div class="card"><h2>Claude API</h2><div class="muted">拍照辨識需要 API 金鑰，請到 console.anthropic.com 申請。金鑰只存在這支手機。</div>${fld('s_key','API 金鑰','password',esc(S.apiKey),'autocomplete="off" placeholder="sk-ant-..."')}${fld('s_model','模型','text',esc(S.model))}<div class="grid2" style="margin-top:10px"><button class="btn sec" onclick="testKey()">測試連線</button><button class="btn" onclick="saveKey()">儲存</button></div></div>`;
  h+=alcoholPlanCard(false);
  h+=`<div class="card"><h2>每日營養標準</h2><div class="grid2">${fld('t_kcal','熱量上限（大卡）','number',T.kcal)}${fld('t_cmin','碳水最低（g）','number',T.carbsMin)}${fld('t_p0','蛋白質最低（g）','number',T.protein[0])}${fld('t_p1','蛋白質最高（g）','number',T.protein[1])}${fld('t_c0','碳水目標下限（g）','number',T.carbs[0])}${fld('t_c1','碳水目標上限（g）','number',T.carbs[1])}${fld('t_f0','脂肪最低（g）','number',T.fat[0])}${fld('t_f1','脂肪最高（g）','number',T.fat[1])}${fld('t_sat','飽和脂肪上限（g）','number',T.satfat)}${fld('t_sug','添加糖上限（g）','number',T.sugar)}${fld('t_fib','纖維最低（g）','number',T.fiber)}${fld('t_na','鈉上限（mg）','number',T.sodium)}</div>
  <h2 style="margin-top:14px">體重目標</h2><div class="grid3">${fld('g_start','起始（kg）','number',S.startWeight)}${fld('g_1','第一階段','number',S.goals[0])}${fld('g_2','第二階段','number',S.goals[1])}</div>${fld('g_h','身高（cm）','number',S.height)}
  <button class="btn block" style="margin-top:12px" onclick="saveTargets()">儲存標準</button><button class="btn sec block" style="margin-top:8px" onclick="resetTargets()">恢復預設標準</button></div>`;
  h+=`<div class="card"><h2>提醒時間</h2><div class="muted">這個時間過後還沒記錄，打開 App 時會在首頁提醒。</div><div class="grid2">${fld('r_b','早餐','time',R.breakfast)}${fld('r_l','午餐','time',R.lunch)}${fld('r_d','晚餐','time',R.dinner)}${fld('r_w','量體重','time',R.weigh)}</div><button class="btn block" style="margin-top:12px" onclick="saveRem()">儲存提醒</button></div>`;
  h+=`<div class="card"><h2>資料備份</h2><div class="muted">資料只存在這支手機的瀏覽器裡，建議每週匯出一次備份。</div><div class="grid2" style="margin-top:10px"><button class="btn sec" onclick="exportData()">匯出備份</button><label class="btn sec">匯入備份<input class="hidefile" type="file" accept="application/json,.json" onchange="importData(this)"></label></div><button class="btn danger block" style="margin-top:8px" onclick="clearAll()">清除所有資料</button></div><div class="muted" style="text-align:center;margin:8px 0">飲食控制 v1.0　營養估算僅供參考，用藥與飲食調整請依醫囑。</div>`;
  return h;
}
function saveKey(){db.settings.apiKey=$('#s_key').value.trim();db.settings.model=$('#s_model').value.trim()||DEFAULTS.model;save();toast('已儲存')}
async function testKey(){saveKey();toast('測試中…');try{await callRaw([{type:'text',text:'請只回覆 OK'}],10);toast('連線成功')}catch(e){alert('連線失敗：'+e.message)}}
function saveTargets(){const n=id=>num($('#'+id).value),S=db.settings;S.targets={kcal:n('t_kcal'),carbsMin:n('t_cmin'),protein:[n('t_p0'),n('t_p1')],carbs:[n('t_c0'),n('t_c1')],fat:[n('t_f0'),n('t_f1')],satfat:n('t_sat'),sugar:n('t_sug'),fiber:n('t_fib'),sodium:n('t_na')};S.startWeight=n('g_start');S.goals=[n('g_1'),n('g_2')];S.height=n('g_h');save();toast('已儲存標準')}
function resetTargets(){if(!confirm('恢復預設的營養標準與體重目標？'))return;Object.assign(db.settings,{targets:structuredClone(DEFAULTS.targets),startWeight:DEFAULTS.startWeight,goals:[...DEFAULTS.goals],height:DEFAULTS.height});save();renderView();toast('已恢復預設')}
function saveRem(){db.settings.reminders={breakfast:$('#r_b').value,lunch:$('#r_l').value,dinner:$('#r_d').value,weigh:$('#r_w').value};save();toast('已儲存提醒')}
function exportData(){const b=new Blob([JSON.stringify({...db,settings:{...db.settings,apiKey:''}},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`飲食控制備份-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function importData(input){const f=input.files[0];input.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.meals))throw 0;if(!confirm('匯入會取代目前所有資料，確定嗎？'))return;const key=db.settings.apiKey;db=migrate(d);if(!db.settings.apiKey)db.settings.apiKey=key;save();toast('匯入完成');renderView()}catch(e){alert('檔案格式不正確')}};r.readAsText(f)}
function clearAll(){if(!confirm('確定清除所有紀錄與設定？這個動作無法復原。'))return;if(!confirm('再確認一次：清除全部資料？'))return;localStorage.removeItem(KEY);db=load();draft=null;renderView();toast('已清除')}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!busy&&!draft)renderView()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
renderView();
</script>
</body>
</html>
